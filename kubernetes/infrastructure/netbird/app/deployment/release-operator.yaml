apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbird-operator
  namespace: netbird
spec:
  interval: 1h0m0s
  chartRef:
    kind: OCIRepository
    name: netbird-operator
  values:
    managementURL: "https://vpn.h-bk.xyz:443"
    cluster:
      name: fonzdm-talos
    netbirdAPI:
      keyFromSecret:
        name: "netbird-mgmt-api-key"
        key: "NB_API_KEY"
