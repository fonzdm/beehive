apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api-crds
  namespace: crd-ns
spec:
  interval: 1h
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: gateway-api-crds
  path: ./config/crd/standard
  prune: false
  deletionPolicy: Orphan
  wait: true