apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: traefik
    namespace: ingress
spec:
    interval: 1h0m0s
    chart:
        spec:
            chart: traefik
            sourceRef:
                kind: HelmRepository
                name: traefik-repo
    upgrade:
        remediation:
            retries: 5
    values:
        deployment:
            replicas: 2
        providers:
            kubernetesGateway:
                enabled: true
            kubernetesIngress:
                enabled: false
            kubernetesCRD:
                enabled: true
                allowCrossNamespace: true
        ports:
            web:
                port: 80
            websecure:
                port: 443
                transport:
                    respondingTimeouts:
                        readTimeout: 600s
                        idleTimeout: 600s
                        writeTimeout: 600s
        ingressRoute:
            dashboard:
                enabled: true
                # Custom match rule with host domain
                matchRule: Host(`ingress.infra.fonzdm.xyz`)
                entryPoints:
                    - websecure
                middlewares:
                    - name: dashboard-auth
        extraObjects:
            - apiVersion: v1
              kind: Secret
              metadata:
                name: dashboard-auth-secret
              type: kubernetes.io/basic-auth
              stringData:
                username: ENC[AES256_GCM,data:pLHiCNhc,iv:fOFfYRjOPVjlGy3aSDkdpP2ZX9JsYjLpjTzmKNguw5Q=,tag:W8i3QVRaM+YCCTcHQNvhcg==,type:str]
                password: ENC[AES256_GCM,data:YDd7u9+f3O6bFHEbuqg6gWxwzpA=,iv:zYxj10zMAPoqymhslzUbDjo/LfYs9jqaM+aBVhZKAXY=,tag:D8F4y3Cux5oCZbLR6IkGeA==,type:str]
            - apiVersion: traefik.io/v1alpha1
              kind: Middleware
              metadata:
                name: dashboard-auth
              spec:
                basicAuth:
                    secret: dashboard-auth-secret
        gateway:
            enabled: false
        gatewayClass:
            enabled: true
        service:
            annotations:
                metallb.io/ip-allocated-from-pool: external-pool
                metallb.io/allow-shared-ip: external-pool
                metallb.io/loadBalancerIPs: 172.16.0.1
        resources:
            limits:
                cpu: 500m
                memory: 512Mi
            requests:
                cpu: 100m
                memory: 256Mi
        log:
            level: DEBUG
