apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nostr-ditto
  namespace: nostr
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/apps/nostr/ditto/deployment
  targetNamespace: nostr
  prune: true
  timeout: 5m
  dependsOn:
    - name: nostr-opensearch
      namespace: nostr
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: nostr-ditto
      namespace: nostr
