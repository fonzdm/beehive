# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.1.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nostr-cordn
  namespace: nostr
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: cordn-bjw-s
        namespace: nostr
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      coordinator:
        type: deployment
        replicas: 1
        strategy: Recreate
        pod:
          nodeSelector:
            kubernetes.io/arch: amd64
          securityContext:
            # Keep the upstream non-root user; fsGroup grants it access to the PVC.
            runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: ghcr.io/cordn-msg/cordn # {"$imagepolicy": "flux-system:nostr-cordn-imagepolicy:name"}
              tag: v0.5.8 # {"$imagepolicy": "flux-system:nostr-cordn-imagepolicy:tag"}
              digest: sha256:9086667b1c3e2be5e40de23e6838cb5a3459e42526212495c72406b5c844567b # {"$imagepolicy": "flux-system:nostr-cordn-imagepolicy:digest"}
            env:
              CORDN_SERVER_PRIVATE_KEY:
                valueFrom:
                  secretKeyRef:
                    name: nostr-cordn-auth
                    key: CORDN_SERVER_PRIVATE_KEY
              CORDN_RELAY_URLS: wss://relay.nostr.fonzdm.xyz
              CORDN_SERVER_NAME: cordn.nostr.fonzdm.xyz
              CORDN_SERVER_ABOUT: Private MLS chat coordinator operated by fonzdm.
              CORDN_ANNOUNCED: 'true'
              CORDN_STORAGE_BACKEND: sqlite
              CORDN_SQLITE_PATH: /data/cordn.sqlite
              CORDN_MAX_AGE_DAYS: '30'
              CORDN_RATE_LIMIT_ENABLED: 'true'
              CORDN_RATE_LIMIT_REFILL_PER_MINUTE: '500'
              CORDN_RATE_LIMIT_BURST: '160'
              CORDN_RATE_LIMIT_IDLE_TTL_SECONDS: '3600'
              CORDN_MAX_KEY_PACKAGES_PER_IDENTITY: '50'
              CORDN_MAX_LAST_RESORT_KEY_PACKAGES_PER_IDENTITY: '1'
              CORDN_LOG_ABUSE_REJECTIONS: 'true'
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
    persistence:
      data:
        existingClaim: nostr-cordn-data
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
