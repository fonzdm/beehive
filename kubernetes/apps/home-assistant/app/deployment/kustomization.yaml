apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: home-assistant
resources:
  - repository.yaml
  - pvc.yaml
  - release.yaml
  - matter-server.yaml
configMapGenerator:
  - name: home-assistant-configuration
    files:
      - configuration.yaml
generatorOptions:
  disableNameSuffixHash: true
