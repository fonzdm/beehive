apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: proton-drive-backup-state
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: localpv-raid
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: home-assistant-proton-backup
spec:
  suspend: false
  schedule: "17 */6 * * *"
  timeZone: Europe/Rome
  startingDeadlineSeconds: 900
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 14400
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/component: proton-drive-backup
        spec:
          nodeSelector:
            kubernetes.io/arch: amd64
          restartPolicy: Never
          securityContext:
            # Match Home Assistant so the RWO config volume can be mounted by both pods.
            fsGroup: 65533
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: exporter
              image: ghcr.io/fonzdm/proton-drive-backup:0.8.0-3@sha256:560bc13f0b11dde1aed23c735c887c5c82137cd209f11ea63e93f67739901c88
              imagePullPolicy: IfNotPresent
              env:
                - name: HOME_ASSISTANT_BACKUP_DIR
                  value: /config/backups
                - name: PROTON_DRIVE_DESTINATION
                  value: /my-files/Home Assistant Backups
                - name: BACKUP_MINIMUM_AGE_MINUTES
                  value: "5"
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: backups
                  mountPath: /config/backups
                  subPath: backups
                  readOnly: true
                - name: state
                  mountPath: /state
                - name: gpg-key
                  mountPath: /run/secrets/proton-drive-gpg
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: home-assistant-data
            - name: state
              persistentVolumeClaim:
                claimName: proton-drive-backup-state
            - name: gpg-key
              secret:
                secretName: proton-drive-backup-gpg
                defaultMode: 0440
            - name: tmp
              emptyDir: {}
