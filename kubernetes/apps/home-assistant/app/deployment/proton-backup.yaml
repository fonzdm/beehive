apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: proton-drive-backup-state
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: localpv-raid
---
apiVersion: v1
kind: Pod
metadata:
  name: proton-drive-bootstrap
  labels:
    app.kubernetes.io/component: proton-drive-bootstrap
spec:
  nodeSelector:
    kubernetes.io/arch: amd64
  restartPolicy: Always
  securityContext:
    # Match Home Assistant so the RWO config volume can be mounted by both pods.
    fsGroup: 65533
    fsGroupChangePolicy: OnRootMismatch
    runAsGroup: 65532
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: proton-drive
      image: ghcr.io/fonzdm/proton-drive-backup:0.8.0-2@sha256:5dbf65abd2b19a917a05fa4f2a4d433e51ef4b99c92ef020ad620187c3be06e3
      imagePullPolicy: IfNotPresent
      args:
        - tail
        - -f
        - /dev/null
      env:
        - name: PROTON_DRIVE_DESTINATION
          value: /my-files/Home Assistant Backups
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
      volumeMounts:
        - name: backups
          mountPath: /config/backups
          subPath: backups
          readOnly: true
        - name: state
          mountPath: /state
        - name: gpg-key
          mountPath: /run/secrets/proton-drive-gpg
          readOnly: true
        - name: tmp
          mountPath: /tmp
  volumes:
    # This otherwise-unused mount constrains the local state PVC to the same
    # node as Home Assistant's local backup volume.
    - name: backups
      persistentVolumeClaim:
        claimName: home-assistant-data
    - name: state
      persistentVolumeClaim:
        claimName: proton-drive-backup-state
    - name: gpg-key
      secret:
        secretName: proton-drive-backup-gpg
        defaultMode: 0440
    - name: tmp
      emptyDir: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: home-assistant-proton-backup
spec:
  # Enabled only after the one-time Proton browser login is complete.
  suspend: true
  schedule: "17 */6 * * *"
  timeZone: Europe/Rome
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 14400
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/component: proton-drive-backup
        spec:
          nodeSelector:
            kubernetes.io/arch: amd64
          restartPolicy: Never
          securityContext:
            # Match Home Assistant so the RWO config volume can be mounted by both pods.
            fsGroup: 65533
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: exporter
              image: ghcr.io/fonzdm/proton-drive-backup:0.8.0-3@sha256:560bc13f0b11dde1aed23c735c887c5c82137cd209f11ea63e93f67739901c88
              imagePullPolicy: IfNotPresent
              env:
                - name: HOME_ASSISTANT_BACKUP_DIR
                  value: /config/backups
                - name: PROTON_DRIVE_DESTINATION
                  value: /my-files/Home Assistant Backups
                - name: BACKUP_MINIMUM_AGE_MINUTES
                  value: "5"
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: backups
                  mountPath: /config/backups
                  subPath: backups
                  readOnly: true
                - name: state
                  mountPath: /state
                - name: gpg-key
                  mountPath: /run/secrets/proton-drive-gpg
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: home-assistant-data
            - name: state
              persistentVolumeClaim:
                claimName: proton-drive-backup-state
            - name: gpg-key
              secret:
                secretName: proton-drive-backup-gpg
                defaultMode: 0440
            - name: tmp
              emptyDir: {}
