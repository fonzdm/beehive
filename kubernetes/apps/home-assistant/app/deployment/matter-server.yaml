# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: matter-server
  namespace: home-assistant
spec:
  chart:
    spec:
      chart: app-template
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: home-assistant
  interval: 30m
  timeout: 15m
  values:
    controllers:
      matter-server:
        initContainers:
          fix-ipv6-ra: 
            image:
              repository: busybox
              tag: latest
            securityContext:
              privileged: true
            command:
            - sh
            - -c
            - |
              echo 2 > /proc/sys/net/ipv6/conf/iot/accept_ra
              echo 1 > /proc/sys/net/ipv6/conf/iot/accept_ra_rtr_pref
              echo 64 > /proc/sys/net/ipv6/conf/iot/accept_ra_rt_info_max_plen
              echo 0 > /proc/sys/net/ipv6/conf/iot/forwarding
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: |
              [{
                "name": "matter-iot",
                "interface": "iot"
              }]
          securityContext:
            sysctls:
            - name: net.ipv6.conf.all.accept_ra
              value: "2"
            - name: net.ipv6.conf.default.accept_ra
              value: "2"
            - name: net.ipv6.conf.all.accept_ra_rtr_pref
              value: "1"
            - name: net.ipv6.conf.default.accept_ra_rtr_pref
              value: "1"
            - name: net.ipv6.conf.all.accept_ra_rt_info_max_plen
              value: "64"
            - name: net.ipv6.conf.default.accept_ra_rt_info_max_plen
              value: "64"
        containers:
          app:
            image:
              repository: ghcr.io/matter-js/python-matter-server
              tag: stable
            args:
            - --storage-path
            - /data
            - --paa-root-cert-dir
            - /data/credentials
            - --primary-interface
            - iot
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
    rawResources:
      matter-iot-network:
        enabled: true
        forceRename: matter-iot
        manifest:
          apiVersion: k8s.cni.cncf.io/v1
          kind: NetworkAttachmentDefinition
          spec:
            config: |
              {
                "cniVersion": "0.3.1",
                "name": "matter-iot",
                "type": "macvlan",
                "master": "eth1.2",
                "mode": "bridge",
                "mac": "da:6f:47:25:4f:bc",
                "ipam": {
                  "type": "static",
                  "addresses": [
                    {
                      "address": "10.0.1.12/24",
                      "gateway": "10.0.1.1"
                    }
                  ]
                }
              }
    service:
      app:
        ports:
          http:
            port: 5580
    persistence:
      data:
        existingClaim: matter-server-data
        globalMounts:
        - path: /data
