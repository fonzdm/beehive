apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: slskd
    namespace: servarr
spec:
    interval: 30m
    chart:
        spec:
            chart: app-template
            sourceRef:
                kind: HelmRepository
                name: bjw-s
                namespace: servarr
    upgrade:
        cleanupOnFail: true
        remediation:
            retries: 3
    values:
        controllers:
            slskd:
                type: deployment
                pod:
                    securityContext:
                        runAsUser: 1000
                        runAsGroup: 65533
                        fsGroup: 65533
                        fsGroupChangePolicy: OnRootMismatch
                containers:
                    app:
                        image:
                            repository: slskd/slskd
                            tag: latest
                            pullPolicy: IfNotPresent
                        env:
                            TZ: Europe/Rome
                            UMASK: "002"
                            SLSKD_UMASK: "002"
                            SLSKD_REMOTE_CONFIGURATION: true
                            SLSKD_DOWNLOADS_DIR: /media/Downloads
                            SLSKD_INCOMPLETE_DIR: /media/IncompleteDownloads
                            SLSKD_SHARED_DIR: /media/Music
                            SLSKD_USERNAME: fonzdm
                            SLSKD_PASSWORD: ENC[AES256_GCM,data:hkakX2TqQ6M=,iv:ZOTrOXyai0rk//GO9+4IesLAdyHsgLsuuy9FP5x+7M8=,tag:gme9xSa7YUaKrHkhNM/tmg==,type:str]
                            SLSKD_SLSK_USERNAME: fonzdm-slsk-user
                            SLSKD_SLSK_PASSWORD: ENC[AES256_GCM,data:kBXw7hKXbuFMyQjDS6iNYQ==,iv:irLdqttKgtl9CqG0yX5FjZQlYKs2Dk+XO76MwbmIUjg=,tag:HJ/H8MWRbYAPC8ov8HcObw==,type:str]
                            SLSKD_API_KEY: ENC[AES256_GCM,data:5X8tFYcpS0lI0k/BjSvIlyaCM/22tq/HxBjtowJcerJxGjlRgGI2BprMrt2j58Hoo/j96hdDonFI,iv:N4xoOHdqHxMKahpIl7zD8OCzMupSC2ro/hjfu0o7wNM=,tag:Muir6ZZZfbkgkPYLRvkJCg==,type:str]
                        ports:
                            - name: http
                              containerPort: 5030
                            - name: soulseek
                              containerPort: 50300
                        probes:
                            liveness:
                                enabled: true
                                spec:
                                    periodSeconds: 30
                                    timeoutSeconds: 5
                                    failureThreshold: 5
                            readiness:
                                enabled: true
                            startup:
                                enabled: true
                                spec:
                                    failureThreshold: 30
                                    periodSeconds: 10
        service:
            app:
                controller: slskd
                ports:
                    http:
                        port: 5030
                    soulseek:
                        port: 50300
        ingress:
            main:
                enabled: false
                # enable later if you expose through traefik/nginx
        persistence:
            config:
                enabled: true
                type: persistentVolumeClaim
                accessMode: ReadWriteOnce
                size: 2Gi
                globalMounts:
                    - path: /app
            media:
                enabled: true
                existingClaim: talos-media-volume
                globalMounts:
                    - path: /media
        resources:
            requests:
                cpu: 50m
                memory: 256Mi
            limits:
                memory: 1Gi
    timeout: 10m
