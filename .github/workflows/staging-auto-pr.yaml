name: Staging Auto-PR
on:
  push:
    branches:
      - flux-auto-images-updates

concurrency:
  group: flux-image-update-pr
  cancel-in-progress: false

jobs:
  pull-request:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Generate Pull Request Description
      run: |
        git fetch origin main
        python .github/scripts/image-update-pr.py
    - name: Create or Update Pull Request
      env:
        GH_TOKEN: ${{ secrets.PR_PAT }} # used implicitly by the gh CLI to authenticate with GitHub
        GITHUB_REPO: ${{ github.repository }}
      run: |
        existing_pr=$(gh pr list --repo="$GITHUB_REPO" \
          --head=flux-auto-images-updates --base=main --state=open \
          --json number --jq '.[0].number // empty')
        title=$(cat "$RUNNER_TEMP/image-update-pr-title.txt")
        if [ -n "$existing_pr" ]; then
          gh pr edit "$existing_pr" --repo="$GITHUB_REPO" \
            --title="$title" --body-file="$RUNNER_TEMP/image-update-pr-body.md"
          exit 0
        fi
        gh pr create \
          --repo="$GITHUB_REPO" \
          --head=flux-auto-images-updates \
          --base=main \
          --title="$title" \
          --body-file="$RUNNER_TEMP/image-update-pr-body.md" \
          --reviewer=fonzdm
