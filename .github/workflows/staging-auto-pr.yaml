name: Staging Auto-PR
on:
  push:
    branches:
      - flux-auto-images-updates

concurrency:
  group: flux-image-update-pr
  cancel-in-progress: false

jobs:
  pull-request:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Create Pull Request
      env:
        GH_TOKEN: ${{ secrets.PR_PAT }} # used implicitly by the gh CLI to authenticate with GitHub
        GITHUB_REPO: ${{ github.repository }}
      run: |
        existing_pr=$(gh pr list --repo="$GITHUB_REPO" \
          --head=flux-auto-images-updates --base=main --state=open \
          --json number --jq 'length')
        if [ "$existing_pr" -gt 0 ]; then
          exit 0
        fi
        gh pr create \
          --repo="$GITHUB_REPO" \
          --head=flux-auto-images-updates \
          --base=main \
          --title="chore(images): update container images" \
          --body="Flux detected container image updates. Review and merge this PR to deploy them." \
          --reviewer=fonzdm
